name: eduos

services:
  postgres:
    image: postgres:16-alpine
    container_name: eduos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduos}
      POSTGRES_USER: ${POSTGRES_USER:-eduos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduos_secret}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-eduos} -d ${POSTGRES_DB:-eduos}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eduos-redis
    restart: unless-stopped
    # Production: set REDIS_PASSWORD. When set, the server requires auth and
    # the API connects with the password (see the api service REDIS_URL).
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then
        exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\";
      else
        exec redis-server --appendonly yes;
      fi"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null || redis-cli ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: eduos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'cat < /dev/null > /dev/tcp/127.0.0.1/9000 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create the application bucket so the API can write objects.
  minio-init:
    image: minio/mc:latest
    container_name: eduos-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
        \"${S3_ACCESS_KEY_ID:-minioadmin}\"
        \"${S3_SECRET_ACCESS_KEY:-minioadmin}\" &&
      mc mb --ignore-existing local/${S3_BUCKET:-eduos}
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: eduos-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-eduos}:${POSTGRES_PASSWORD:-eduos_secret}@postgres:5432/${POSTGRES_DB:-eduos}?schema=public
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-eduos}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to comma-separated HTTPS origins}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-true}
      AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:?Set AUTH_PUBLIC_BASE_URL to the public HTTPS web URL}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM to the verified sender address}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST to the transactional email server}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    ports:
      - '3001:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot migration runner: applies `prisma migrate deploy` before the API
  # starts, so API replicas never race on schema migrations.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: eduos-migrate
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-eduos}:${POSTGRES_PASSWORD:-eduos_secret}@postgres:5432/${POSTGRES_DB:-eduos}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: eduos-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  minio_data:
